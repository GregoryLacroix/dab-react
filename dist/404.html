<script>
// Page statique servie par le serveur web : française par défaut, anglaise si l'adresse commence par /en
(function () {
  if (!/^\/en(\/|$)/.test(location.pathname)) return;
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-en]').forEach(function (el) {
    if (el.tagName === 'IMG') el.alt = el.getAttribute('data-en'); else el.textContent = el.getAttribute('data-en');
  });
  document.querySelectorAll('[data-en-href]').forEach(function (el) { el.href = el.getAttribute('data-en-href'); });
  if (document.documentElement.hasAttribute('data-en-title')) document.title = document.documentElement.getAttribute('data-en-title');
})();
</script>
