<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#faf6ef" />
  <title>Hors connexion | Les galets d’Ambre</title>
  <style>
    :root { color-scheme: light dark; --bg: #faf6ef; --fg: #000; --soft: #4a4034; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14120f; --fg: #f3eee5; --soft: #d9d1c3; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, Arial, sans-serif; line-height: 1.6; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    main { max-width: 28rem; }
    img { width: 120px; height: 120px; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { color: var(--soft); margin: .4rem 0; }
    button { margin-top: 1.2rem; padding: .8rem 1.6rem; border: 2px solid var(--fg); border-radius: 999px; background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="120" height="120" />
    <h1>Vous êtes hors connexion</h1>
    <p>La boutique a besoin d’Internet pour afficher les galets et enregistrer une commande. Vérifiez votre connexion, puis réessayez.</p>
    <p lang="en"><em>You are offline. Please check your connection and try again.</em></p>
    <button type="button" onclick="location.reload()">Réessayer / Retry</button>
  </main>
</body>
</html>
